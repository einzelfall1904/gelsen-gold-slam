[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Testphase: Seite nicht in Suchmaschinen aufnehmen.
# Vor dem offiziellen Start (mit echtem Impressum) diesen Block entfernen.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
